name: zodiac-api tests

on:
  push:
    paths:
      - 'zodiac/zodiac-api/**'
      - '.github/workflows/zodiac-api-tests.yml'
  pull_request:
    paths:
      - 'zodiac/zodiac-api/**'
      - '.github/workflows/zodiac-api-tests.yml'
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zodiac/zodiac-api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: zodiac/zodiac-api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Golden + SQL normalization tests
        run: python -m pytest tests/test_golden_ai_analysis_accuracy.py tests/test_normalize_table_case.py -v --tb=short

      - name: Intent pipeline unit tests
        run: python -m unittest test_intent_pipeline_v2 -v
